name: tests

# Every pull request and every push to main: the suite, and the secret scan.
# `pull_request` (not `pull_request_target`), so a fork's code never runs with
# this repository's permissions or secrets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libportaudio2 libasound2t64 xvfb \
            gir1.2-atspi-2.0 libgirepository-2.0-dev libcairo2-dev pkg-config build-essential

      - name: Python dependencies
        run: |
          python -m pip install --quiet -r requirements.txt -c constraints.txt pytest pytest-cov PyGObject

      - name: The browser engine some tests drive
        run: python -m playwright install --with-deps chromium

      - name: Nothing private in the change
        if: github.event_name == 'pull_request'
        run: |
          python tools/secret_scan.py --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: The suite
        run: xvfb-run -a python -m pytest tests -q -m "not live" -p no:cacheprovider
