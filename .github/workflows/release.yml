name: release

# Tag-driven. `git tag v0.1.0 && git push --tags` builds all three platforms and
# publishes them as a GitHub release. aethelark.com reads that release through
# /api/aethelark/release and swaps its download button over within ~5 minutes,
# with no deploy on the website side.
#
# workflow_dispatch is here so a build can be rehearsed without burning a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no tag is created)"
        required: true
        default: "0.0.0-dev"

permissions:
  contents: write        # required to create the release and upload assets

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # a broken macOS build must not hide a good Windows one
      matrix:
        include:
          - os: windows-latest
            label: windows
            artifact: Aethelark-${{ github.ref_name }}-setup.exe
          - os: macos-14          # arm64; Intel Macs run it under Rosetta
            label: macos
            artifact: Aethelark-${{ github.ref_name }}.dmg
          - os: ubuntu-22.04      # oldest glibc we support, for forward compat
            label: linux
            artifact: Aethelark-${{ github.ref_name }}.AppImage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve version
        shell: bash
        run: |
          REF="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.version }}"
          fi
          echo "AE_VERSION=${REF#v}" >> "$GITHUB_ENV"

      # Qt WebEngine needs these to link on a bare runner. Everything else is a
      # pure wheel.
      - name: Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libnss3 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libasound2 \
            libgl1-mesa-glx fuse desktop-file-utils

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          # PyQt6-WebEngine is imported by aethelark_web.py but is NOT in
          # requirements.txt - pip install PyQt6 does not provide it. Installed
          # explicitly here so the build cannot fail on a missing import.
          # TODO: add it to requirements.txt and drop this line.
          pip install PyQt6-WebEngine
          pip install pyinstaller==6.11.1

      - name: Build
        shell: bash
        run: pyinstaller packaging/aethelark.spec --noconfirm --clean

      # A bundle that cannot import its own entry point is worthless, and that
      # failure mode is invisible until a user double-clicks it. Catch it here.
      - name: Smoke test the bundle
        shell: bash
        run: python packaging/smoke_test.py

      # ---- package per platform ------------------------------------------

      - name: Package · Windows installer
        if: matrix.label == 'windows'
        shell: bash
        run: |
          iscc //DMyAppVersion=$AE_VERSION packaging/aethelark.iss
          mv packaging/Output/AethelarkSetup.exe "${{ matrix.artifact }}"

      - name: Package · macOS dmg
        if: matrix.label == 'macos'
        run: |
          hdiutil create -volname Aethelark -srcfolder dist/Aethelark.app \
            -ov -format UDZO "${{ matrix.artifact }}"

      - name: Package · Linux AppImage
        if: matrix.label == 'linux'
        run: |
          APPDIR=build/Aethelark.AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp -r dist/Aethelark/. "$APPDIR/usr/bin/"
          cp assets/images/aethelark.png "$APPDIR/aethelark.png"
          cat > "$APPDIR/aethelark.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Aethelark
          Exec=Aethelark
          Icon=aethelark
          Categories=Utility;
          Terminal=false
          DESKTOP
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/Aethelark" "$@"\n' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          wget -qO appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run "$APPDIR" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # One release carrying all three platforms, so the website reports the
      # same version everywhere. The site treats a release with no recognised
      # installer as "not available" and keeps showing the clone command, so a
      # partial upload degrades quietly rather than offering a dead button.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.exe
            *.dmg
            *.AppImage
          generate_release_notes: true
          fail_on_unmatched_files: true
