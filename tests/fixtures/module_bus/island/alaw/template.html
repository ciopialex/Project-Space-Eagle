<div class="island-glance">
  <div class="alaw-head">
    <div class="alaw-mark-slot">
      <div class="alaw-seal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"/><path d="M12 8v5"/><circle cx="12" cy="16" r="0.8" fill="currentColor"/></svg>
      </div>
    </div>
    <div class="alaw-id">
      <div class="alaw-title">{company}</div>
      <div class="alaw-detail">{status_detail}</div>
    </div>
    <div class="alaw-badge">{badge}</div>
  </div>

  <div class="alaw-hero">
    <div class="alaw-figure">{net}</div>
    <div class="alaw-sub">
      <span>Net personal cash</span>
      <span class="alaw-dot"></span>
      <span>Effective <b>{effective}</b></span>
    </div>
  </div>

  <div class="alaw-rule"></div>
</div>

<div class="island-expanded">
  <div class="alaw-grid">
    <div class="alaw-tile"><span class="k">Entity</span><span class="v">{entity_type}</span></div>
    <div class="alaw-tile"><span class="k">Rate</span><span class="v">{rate}</span></div>
    <div class="alaw-tile"><span class="k">Corp Tax</span><span class="v">{tax}</span></div>
    <div class="alaw-tile"><span class="k">CASS</span><span class="v">{cass}</span></div>
  </div>
</div>
